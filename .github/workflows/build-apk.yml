
name: Build SAYYAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Show source being built
        run: |
          echo "Commit:"
          git log -1 --oneline
          echo "Checking old syntax:"
          if grep -nE 'colorScheme:[[:space:]]*\.fromSeed|mainAxisAlignment:[[:space:]]*\.center' lib/main.dart; then
            echo "ERROR: Old invalid syntax still exists in lib/main.dart"
            exit 1
          fi
          echo "Source syntax check passed"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Show Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart source
        run: dart analyze --fatal-infos lib/main.dart

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAYYAR-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
