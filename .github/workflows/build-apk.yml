
name: Build SAYYAR APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        run: |
          if [ -f pubspec.yaml ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f SAYYAR_V2/pubspec.yaml ]; then
            echo "PROJECT_DIR=SAYYAR_V2" >> "$GITHUB_ENV"
          elif [ -f SAYYAR_V2/SAYYAR_V2/pubspec.yaml ]; then
            echo "PROJECT_DIR=SAYYAR_V2/SAYYAR_V2" >> "$GITHUB_ENV"
          else
            echo "ERROR: pubspec.yaml not found"
            find . -name pubspec.yaml
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Generate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter create --platforms=android --project-name sayyar .

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: SAYYAR-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
